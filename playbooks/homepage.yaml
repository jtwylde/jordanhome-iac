- name: Setup Homepage
  hosts: localhost

  vars_files:
    - ../vault/homepagesecrets.yaml

  vars:
    issuer: "letsencrypt"
    base_url: "homepage.{{ base_domain }}"
    state: present

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Deploy Homepage Namespace
    kubernetes.core.k8s:
      state: "{{ state }}"
      definition: "{{ lookup('template', kubernetes_resources ~ '/homepage/namespace.yaml.j2') | from_yaml }}"
  - name: Deploy Homepage Assets PV
    kubernetes.core.k8s:
      state: "{{ state }}"
      definition: "{{ lookup('template', kubernetes_resources ~ '/homepage/assets-pv.yaml.j2') | from_yaml }}"
  - name: Deploy Homepage
    kubernetes.core.k8s:
      state: "{{ state }}"
      definition: "{{ lookup('template', item) | from_yaml }}"
    with_fileglob:
      - "{{ kubernetes_resources }}/homepage/*.yaml.j2"