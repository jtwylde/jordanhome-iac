- name: Setup dashy
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml

  vars:
    base_url: "{{ base_domain }}"
    issuer: "letsencrypt"
    state: present

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Add dashy repo
    kubernetes.core.helm_repository:
      name: selfhosted-helmcharts
      repo_url: https://vyrtualsynthese.github.io/selfhosted-helmcharts/

  - name: Clone dashy helm template
    ansible.builtin.template:
      src: "{{ kubernetes_resources }}/dashy/helm.yaml.j2"
      dest: "{{ root_dir }}/.tmp/dashyhelm.yaml"

  - name: Deploy dashy
    kubernetes.core.helm:
      name: dashy
      chart_ref: selfhosted-helmcharts/dashy
      release_namespace: dashy
      create_namespace: true
      release_state: "{{ state }}"
      wait: true
      values_files: "{{ root_dir }}/.tmp/dashyhelm.yaml"
