- name: Setup dashy
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml

  vars:
    base_url: "{{ base_domain }}"
    issuer: "letsencrypt"
    state: present
    app: dashy

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Deploy Dashy
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-helm.yaml
    vars:
      repo_name: selfhosted-helmcharts
      repo_url: https://vyrtualsynthese.github.io/selfhosted-helmcharts/
      chart_ref: selfhosted-helmcharts/dashy
      deployment_namespace: dashy
