- name: Setup Jellyfin
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml

  vars:
    issuer: "letsencrypt-staging"
    base_url: "wiki.{{ base_domain }}"

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Deploy Gollum
    kubernetes.core.k8s:
      state: absent
      definition: "{{ lookup('template', item) | from_yaml }}"
    with_fileglob:
      - "{{ kubernetes_resources }}/gollum/*.yaml.j2"