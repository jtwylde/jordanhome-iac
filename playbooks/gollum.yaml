- name: Setup Gollum
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml

  vars:
    issuer: "letsencrypt"
    base_url: "wiki.{{ base_domain }}"

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Create Gollum namespace
    kubernetes.core.k8s:
      state: present
      definition: "{{ lookup('template', kubernetes_resources ~ '/gollum/namespace.yaml.j2') | from_yaml }}"

  - name: Deploy Gollum
    kubernetes.core.k8s:
      state: present
      definition: "{{ lookup('template', item) | from_yaml }}"
    with_fileglob:
      - "{{ kubernetes_resources }}/gollum/*.yaml.j2"