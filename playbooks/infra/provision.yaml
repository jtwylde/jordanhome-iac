- name: Provision VMs
  hosts: vms
  gather_facts: false

  vars:
    template_vmid:
      node0: 9000
      node1: 9001

  tasks:
    - name: Clone VM
      delegate_to: localhost
      community.proxmox.proxmox_kvm:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: ansible-api
        api_token_secret: "{{ pve_api_key }}"
        validate_certs: false

        clone: debian-template
        full: false

        node: "{{ pve_node }}"
        vmid: "{{ template_vmid[pve_node] }}"
        newid: "{{ vmid }}"
        name: "{{ inventory_hostname }}"

        net:
          net0: "virtio,bridge=vmbr0"

        state: present

    - name: Configure cloud-init for VMs
      delegate_to: localhost
      community.proxmox.proxmox_kvm:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: ansible-api
        api_token_secret: "{{ pve_api_key }}"
        validate_certs: false

        node: "{{ pve_node }}"
        name: "{{ inventory_hostname }}"

        # hardware specs
        cores: "{{ cores | default(omit) }}"
        memory: "{{ mem | default(omit) }}"
        
        # Networking
        ipconfig:
          ipconfig0: "ip={{ ansible_host }}/24,gw=192.168.1.1"

        update: yes

    - name: Start VMs
      delegate_to: localhost
      community.proxmox.proxmox_kvm:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: ansible-api
        api_token_secret: "{{ pve_api_key }}"

        validate_certs: false

        node: "{{ pve_node }}"
        vmid: "{{ vmid }}"
        name: "{{ inventory_hostname }}"

        state: started
      