- name: Configure External Web Endpoints
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml
    - ../vars/external-web-apps.yaml

  vars:
    issuer: "letsencrypt"

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
    - name: Create external web endpoints
      ansible.builtin.include_role:
        name: external_web_endpoint
      vars:
        endpoint_name: "{{ item.key }}"
        url: "{{ item.value.url_prefix | default(item.key) }}.{{ base_domain }}"
        endpoint_ip: "{{ hostvars[item.value.host].ansible_host }}"
        endpoint_port: "{{ item.value.web_port }}"
        backend_https: "{{ item.value.backend_https | default(false) }}"
      loop: "{{ webapps | dict2items }}"
