- name: Setup Jellyfin
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml

  vars:
    config_backup_cron: "0 15 * * *"
    base_url: "media.{{ base_domain }}"
    issuer: "letsencrypt"
    state: present
    app: jellyfin

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Deploy initial Jellyfin resources
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-j2-templates-list.yaml
    vars:
      app: jellyfin
      resources: 
        - namespace
        - media-library-pv
        - media-library-pvc
        - media-config-backups-pvc

  - name: Deploy Jellyfin
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-helm.yaml
    vars:
      repo_name: jellyfin
      repo_url: https://jellyfin.github.io/jellyfin-helm
      chart_ref: jellyfin/jellyfin
      deployment_namespace: jellyfin

  - name: Deploy Sonarr
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-j2-templates-dir.yaml
    vars:
      app: sonarr

  - name: Deploy Radarr
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-j2-templates-dir.yaml
    vars:
      app: radarr

  - name: Deploy Prowlarr
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-j2-templates-dir.yaml
    vars:
      app: prowlarr

  - name: Deploy Bazarr
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-j2-templates-dir.yaml
    vars:
      app: bazarr

  - name: Deploy Qbittorrent
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-j2-templates-dir.yaml
    vars:
      app: qbittorrent

  - name: Deploy Jellyseerr
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-j2-templates-dir.yaml
    vars:
      app: jellyseerr