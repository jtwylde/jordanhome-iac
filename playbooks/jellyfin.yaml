- name: Setup Jellyfin
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Create Jellyfin namespace
    kubernetes.core.k8s:
      state: present
      src: "{{ kubernetes_resources }}/jellyfin/namespace.yaml"

  - name: Setup NFS Sync PV
    kubernetes.core.k8s:
      state: present
      src: "{{ kubernetes_resources }}/jellyfin/media-library-pv.yaml"

  - name: Setup NFS Sync PVC
    kubernetes.core.k8s:
      state: present
      src: "{{ kubernetes_resources }}/jellyfin/media-library-pvc.yaml"

  - name: Add jellyfin repo
    kubernetes.core.helm_repository:
      name: jellyfin
      repo_url: https://jellyfin.github.io/jellyfin-helm

  - name: Deploy Jellyfin
    kubernetes.core.helm:
      name: jellyfin
      chart_ref: jellyfin/jellyfin
      release_namespace: jellyfin
      create_namespace: true
      release_state: present
      wait: true
      values_files: "{{ kubernetes_resources }}/jellyfin/helm.yaml"

  - name: Deploy Sonarr
    kubernetes.core.k8s:
      state: present
      src: "{{ item }}"
    with_fileglob:
      - "{{ kubernetes_resources }}/sonarr/*.yaml"