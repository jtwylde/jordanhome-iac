- name: Setup headlamp
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml

  vars:
    base_url: "headlamp.{{ base_domain }}"
    issuer: "letsencrypt"
    state: present

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Add headlamp repo
    kubernetes.core.helm_repository:
      name: headlamp
      repo_url: https://kubernetes-sigs.github.io/headlamp/

  - name: Clone Headlamp helm template
    ansible.builtin.template:
      src: "{{ kubernetes_resources }}/headlamp/helm.yaml.j2"
      dest: "{{ root_dir }}/.tmp/headlamphelm.yaml"

  - name: Deploy headlamp
    kubernetes.core.helm:
      name: headlamp
      chart_ref: headlamp/headlamp
      release_namespace: kube-system
      create_namespace: true
      release_state: "{{ state }}"
      wait: true
      values_files: "{{ root_dir }}/.tmp/headlamphelm.yaml"

  - name: Create headlamp ingress
    kubernetes.core.k8s:
      state: "{{ state }}"
      definition: "{{ lookup('template', kubernetes_resources ~ '/headlamp/ingress.yaml.j2') | from_yaml }}"
