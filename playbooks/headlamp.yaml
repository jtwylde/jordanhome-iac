- name: Setup headlamp
  hosts: localhost

  vars_files:
    - ../vault/vault.yaml

  vars:
    base_url: "headlamp.{{ base_domain }}"
    issuer: "letsencrypt"
    state: present
    app: headlamp

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
  - name: Deploy Headlamp
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-helm.yaml
    vars:
      repo_name: headlamp
      repo_url: https://kubernetes-sigs.github.io/headlamp/
      chart_ref: headlamp/headlamp
      deployment_namespace: kube-system

  - name: Create Headlamp ingress
    ansible.builtin.include_role:
      name: k8s
      tasks_from: apply-j2-template.yaml
    vars:
      resource: ingress
