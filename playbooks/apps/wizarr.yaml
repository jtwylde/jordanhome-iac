- name: Setup Wizarr
  hosts: localhost

  vars:
    base_url: "{{ base_domain }}"
    issuer: "letsencrypt"
    state: present
    app: wizarr

  environment: 
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_location }}"

  tasks:
    # Ensure namespace is created first
    - name: Create Wizarr namespace
      ansible.builtin.include_role:
        name: k8s
        tasks_from: apply-j2-template.yaml
      vars:
        resource: namespace

    - name: Deploy Wizarr
      ansible.builtin.include_role:
        name: k8s
        tasks_from: apply-j2-templates-dir.yaml