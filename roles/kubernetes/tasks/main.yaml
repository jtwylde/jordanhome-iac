- name: Log a custom debug message
  ansible.builtin.debug:
    msg: "The target environment is {{ cloudflare_api_token }}"

- name: Create a k8s namespace
  kubernetes.core.k8s:
    name: testing
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: "{{ kubeconfig_location }}"

- name: Deploy latest version of cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: oci://quay.io/jetstack/charts/cert-manager
    chart_version: v1.20.3
    release_namespace: cert-manager
    create_namespace: true
    release_state: present
    values:
      crds:
        enabled: true
    wait: true

# create cluster issuer
- name: Deploy cloudflare token
  kubernetes.core.k8s:
    state: present
    src: "{{ kubernetes_resources }}/secrets/cloudflare-token.yaml"

- name: Deploy LE Cluster Issuer
  kubernetes.core.k8s:
    state: present
    src: "{{ kubernetes_resources }}/clusterissuer/letsencrypt.yaml"

